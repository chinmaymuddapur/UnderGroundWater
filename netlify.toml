# ─── Netlify Build & Deploy Configuration ────────────────────────────────────
# Smart Aquifer Sentinel — Frontend

[build]
  # Directory containing package.json (project root)
  base    = "."
  # Vite build output directory
  publish = "dist"
  # Build command — tsc type-check then vite bundle
  command = "npm run build"

[build.environment]
  # Node version — must match what you develop on locally
  NODE_VERSION = "20"

# ─── Redirect all routes to index.html for React Router (SPA) ────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ─── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"
    # Content-Security-Policy: adjust if you add third-party scripts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.onrender.com; img-src 'self' data:;"

# ─── Cache static assets aggressively ────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
